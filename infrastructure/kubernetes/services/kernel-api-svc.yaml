apiVersion: v1
kind: Service
metadata:
  name: shivi-kernel-api
  namespace: shivi-platform
  labels:
    app: kernel-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app: kernel-api
