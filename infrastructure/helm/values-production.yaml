# ShiVi Production Overrides
replicaCount: 5
autoscaling:
  minReplicas: 5
  maxReplicas: 100
  targetCPUUtilizationPercentage: 65
resources:
  requests:
    cpu: 1000m
    memory: 1Gi
  limits:
    cpu: 4000m
    memory: 4Gi
dr:
  enabled: true
  region: us-east1
  failoverMode: automatic
  rpo: "30s"
  rto: "2m"
